# Statische site, geen build step. Netlify serveert de repo-root direct.
#
# functions/api/route.js en geocode.js zijn geschreven voor Cloudflare Pages
# (onRequestGet-signatuur) en draaien hier niet. Dat is geen probleem: de app
# controleert bij het opstarten of er een proxy op ./api draait (zie DIENSTEN
# in index.html) en valt zonder proxy vanzelf terug op de publieke OSRM-demo-
# server en Nominatim, zonder eigen sleutel. Wil je later toch een proxy met
# eigen routeringssleutel op Netlify, dan moeten die twee bestanden naar het
# Netlify Functions-formaat (netlify/functions/*.js) omgezet worden.

[build]
  publish = "."

# Beveiligingsheaders voor elke pagina. De Content-Security-Policy laat alleen
# eigen scriptbestanden toe (geen inline script: het themascript en het script
# van de mag-ik-pagina's staan daarom in js/), eigen stijlen plus inline
# style-attributen (voortgangsbalken, markerposities), eigen plaatjes en
# data:-URI's (de SVG's in de CSS), en verbindingen naar de eigen origin en de
# twee routediensten. Komt er een proxy op ./api, dan valt die onder 'self'.
# Wissel je van routedienst, pas dan connect-src aan.
#
# Lokaal testen: de scratchpad-server csp_server.py stuurt dit blok mee.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://router.project-osrm.org https://nominatim.openstreetmap.org; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
